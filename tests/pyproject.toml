[project]
name = "tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6.0",
    "pytest>=7.4.0",
    "requests>=2.31.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
