# Secret 模板：真实值通过 kubectl apply 单独注入，不提交 Git
# 来源 1：deploy/.mongodb-url（单行 MongoDB 连接串）
# 来源 2：deploy/.agent-env（KEY=VALUE 行：LLM key、Langfuse dev/prod key 等）
apiVersion: v1
kind: Secret
metadata:
  name: easy-book-config
  namespace: easy-book
type: Opaque
stringData:
  MONGODB_URL: mongodb://easy-book:<password>@10.0.20.14:27017/easy_book?authSource=admin
  DB_NAME: easy_book
  ENVIRONMENT: production
  # 以下来自 deploy/.agent-env（KEY=VALUE 行）：
  # 鉴权：ADMIN_PHONE / ADMIN_PASSWORD（启动时自动建管理员，手机号登录）
  #       ADMIN_SOURCE_TYPE（管理员来源标记：human/ai_test，测试账号用 ai_test，供评测区分）
  #       EASY_BOOK_JWT_SECRET（令牌签名）/ EASY_BOOK_SERVICE_KEY（agent→backend 服务密钥）
  # LLM：BOOK_AGENT_LLM_API_KEY / BOOK_AGENT_LLM_MODEL
  # 观测：LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY（dev）
  #       LANGFUSE_PROD_PUBLIC_KEY / LANGFUSE_PROD_SECRET_KEY（prod）
  #       CHAINLIT_AUTH_SECRET（Chainlit 会话 cookie 签名）
