# Secret 模板：真实值通过 kubectl apply 单独注入，不提交 Git
# 来源 1：deploy/.mongodb-url（单行 MongoDB 连接串）
# 来源 2：deploy/.agent-env（KEY=VALUE 行：LLM key、Langfuse dev/prod key 等）
apiVersion: v1
kind: Secret
metadata:
  name: easy-book-config
  namespace: easy-book
type: Opaque
stringData:
  MONGODB_URL: mongodb://easy-book:<password>@10.0.20.14:27017/easy_book?authSource=admin
  DB_NAME: easy_book
  ENVIRONMENT: production
  # 以下来自 deploy/.agent-env（easy-book-agent 容器使用）：
  # BOOK_AGENT_LLM_API_KEY / BOOK_AGENT_LLM_MODEL
  # LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY（dev）
  # LANGFUSE_PROD_PUBLIC_KEY / LANGFUSE_PROD_SECRET_KEY（prod）
