# Secret 模板：真实值通过 kubectl apply 单独注入（CI 用 gh secret 中的 MONGODB_URL），不提交 Git
apiVersion: v1
kind: Secret
metadata:
  name: easy-book-config
  namespace: easy-book
type: Opaque
stringData:
  MONGODB_URL: mongodb://easy-book:<password>@10.0.20.14:27017/easy_book?authSource=admin
  DB_NAME: easy_book
  ENVIRONMENT: production
