# easy-book 前端容器内 Nginx：静态托管 dist + /api 反代到 backend Service
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 FastAPI 后端 Service
    location /api/ {
        proxy_pass http://easy-book-backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 助手（Chainlit）：保留 /ai 前缀转发（Chainlit 以 --root-path /ai 挂载），
    # 需支持 WebSocket 升级（聊天长连接）。
    # 全站统一登录：auth_request 校验会话 cookie（eb_token），未登录 302 回 /login。
    location ^~ /ai {
        auth_request /auth-check;
        error_page 401 = @ai-login-redirect;

        proxy_pass http://easy-book-agent:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 未登录访问 /ai → 回登录页
    location @ai-login-redirect {
        return 302 /login;
    }

    # 会话校验子请求（仅 nginx 内部用，外部不可达）
    location = /auth-check {
        internal;
        proxy_pass http://easy-book-backend:8002/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
