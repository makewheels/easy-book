[project]
name = "book-agent"
version = "0.1.0"
description = "Easy-Book 泳课管理系统的自然语言 agent（工具层 + agent loop）"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.20.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Langfuse trace 观测（book_agent/trace.py；未装或未配 LANGFUSE_* 时整体 no-op）
langfuse = [
    "langfuse>=4",
]
web = [
    "chainlit>=2.11.1",
    # chainlit 2.11.1 未验证 starlette 1.x 兼容（静态资源 FileResponse 事件循环问题），
    # 钉在 0.x；升级 chainlit 后可尝试放开
    "starlette<1.0",
]

[project.scripts]
book-agent = "book_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["book_agent"]

[tool.uv]
package = true
