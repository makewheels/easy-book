[project]
name = "book-agent"
version = "0.1.0"
description = "Easy-Book 泳课管理系统的自然语言 agent（工具层 + agent loop）"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Langfuse trace 观测（book_agent/trace.py；未装或未配 LANGFUSE_* 时整体 no-op）
langfuse = [
    "langfuse>=4",
]

[project.scripts]
book-agent = "book_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["book_agent"]

[tool.uv]
package = true
