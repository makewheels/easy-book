[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "motor>=3.6",
    "pydantic==2.10.6",
    "pymongo==4.15.4",
    "python-dateutil==2.9.0",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.18",
    "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.27",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10
