name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-unit-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # uv sync 按 uv.lock 安装（含 dev 组：pytest/pytest-asyncio/httpx）
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run unit tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/unit/ -v --tb=short

  backend-integration-tests:
    name: 后端集成测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run integration tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm run build

  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/easy-book

            # 拉取最新代码
            git pull origin master

            # 安装 uv（走 pip，服务器可访问 PyPI；装到系统路径）
            if ! command -v uv >/dev/null 2>&1; then
              sudo pip3 install uv --break-system-packages -q
            fi

            # 后端：uv 按 lockfile 装到独立 .venv（不再污染系统 Python）
            # 只用系统 Python 3.12，禁止联网下载托管 Python
            cd backend
            export UV_PYTHON_DOWNLOADS=never
            uv sync --frozen --no-dev --python-preference only-system

            # 同步 systemd 单元（ExecStart 指向 .venv/bin/python）并 reload
            sudo cp easy-book.service /etc/systemd/system/easy-book.service
            sudo systemctl daemon-reload

            # 构建前端（pnpm，与 lockfile 保持一致）
            cd ../frontend
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --silent
            fi
            pnpm install --frozen-lockfile --silent
            pnpm run build

            # 重启后端服务
            sudo systemctl restart easy-book

            # 健康检查
            sleep 3
            curl -sf http://localhost:8002/health > /dev/null && echo "✅ Backend healthy" || exit 1
            curl -sf http://localhost/api/students/ > /dev/null && echo "✅ Nginx proxy OK" || exit 1
