name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: 代码质量门禁
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Ruff (agent)
        working-directory: agent
        run: uv sync --frozen && uv run ruff check

      - name: Ruff (backend)
        working-directory: backend
        run: uv sync --frozen && uv run ruff check

      - name: Ruff (tests)
        working-directory: tests
        run: uv sync --frozen && uv run ruff check

      - name: 文件长度检查
        run: python scripts/check_file_length.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint (frontend)
        working-directory: frontend
        run: pnpm run lint

  backend-unit-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # uv sync 按 uv.lock 安装（含 dev 组：pytest/pytest-asyncio/httpx）
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run unit tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/unit/ -v --tb=short

  backend-integration-tests:
    name: 后端集成测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run integration tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm run build

  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    # 部署目标：services 机（101.42.94.17）k3s，入口 easybook.a4.fit（Caddy）
    # 流程：runner rsync 代码到服务器 → deploy/deploy.sh 构建镜像、导入 k3s、apply、健康检查
    steps:
      - uses: actions/checkout@v4

      - name: 从 Infisical 读取生产配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 2fcb7439-3d9d-4a03-868d-091f5d8aea35
          oidc-audience: infisical://secrets.a4.fit/makewheels/easy-book
          domain: https://secrets.a4.fit
          project-slug: easy-book-secrets
          env-slug: prod
          secret-path: /
          recursive: true

      - name: 从 common 读取共享 LLM 配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 2fcb7439-3d9d-4a03-868d-091f5d8aea35
          oidc-audience: infisical://secrets.a4.fit/makewheels/easy-book
          domain: https://secrets.a4.fit
          project-slug: common-shared
          env-slug: dev
          secret-path: /llm/easy-book

      - name: 写入 SSH 密钥
        run: |
          runner_temp_resolved=$(cd "$RUNNER_TEMP" && pwd -P)
          ssh_tmp_dir=$(mktemp -d "$runner_temp_resolved/easy-book-ssh.XXXXXX")
          printf 'SSH_TMP_DIR=%s\n' "$ssh_tmp_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_tmp_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_tmp_dir/known_hosts"
          chmod 600 "$ssh_tmp_dir/key"
          chmod 600 "$ssh_tmp_dir/known_hosts"

      - name: 同步代码到服务器
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude '.mongodb-url' --exclude '.agent-env' \
            -e "ssh -i $SSH_TMP_DIR/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_TMP_DIR/known_hosts -o StrictHostKeyChecking=yes" \
            ./ "${SERVER_USER}@${SERVER_HOST}:/home/ubuntu/easy-book/"

      - name: 执行部署
        run: |
          emit_env() {
            local key=$1
            printf '%s=%s\n' "$key" "${!key}"
          }
          {
            for key in \
              MONGODB_URL DB_NAME ENVIRONMENT \
              BOOK_AGENT_LLM_API_KEY BOOK_AGENT_LLM_MODEL \
              LANGFUSE_HOST LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY \
              LANGFUSE_PROD_PUBLIC_KEY LANGFUSE_PROD_SECRET_KEY \
              CHAINLIT_AUTH_SECRET EASY_BOOK_JWT_SECRET EASY_BOOK_SERVICE_KEY \
              ADMIN_PHONE ADMIN_PASSWORD ADMIN_SOURCE_TYPE; do
              emit_env "$key"
            done
          } | ssh -i "$SSH_TMP_DIR/key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_TMP_DIR/known_hosts" -o StrictHostKeyChecking=yes \
            "${SERVER_USER}@${SERVER_HOST}" '
              set -eu
              runtime_root=$(cd "${TMPDIR:-/tmp}" && pwd -P)
              runtime_file=$(mktemp "$runtime_root/easy-book-runtime.XXXXXX")
              case "$runtime_file/" in "$runtime_root"/*) ;; *) exit 1 ;; esac
              cleanup() {
                case "$runtime_file/" in
                  "$runtime_root"/*) [ ! -e "$runtime_file" ] || unlink "$runtime_file" ;;
                esac
              }
              trap cleanup EXIT HUP INT TERM
              chmod 600 "$runtime_file"
              cat > "$runtime_file"
              cd /home/ubuntu/easy-book
              INFISICAL_ENV_FILE="$runtime_file" ./deploy/deploy.sh
            '

      - name: 清理临时 SSH 文件
        if: always()
        run: |
          [ -n "${SSH_TMP_DIR:-}" ] || exit 0
          runner_temp_resolved=$(cd "$RUNNER_TEMP" && pwd -P)
          ssh_tmp_dir_resolved=$(cd "$SSH_TMP_DIR" && pwd -P)
          case "$ssh_tmp_dir_resolved" in
            "$runner_temp_resolved"/easy-book-ssh.*)
              [ -d "$ssh_tmp_dir_resolved" ]
              [ ! -L "$ssh_tmp_dir_resolved" ]
              rm -rf -- "$ssh_tmp_dir_resolved"
              ;;
            *)
              echo "拒绝清理非 Runner 临时目录：$ssh_tmp_dir_resolved" >&2
              exit 1
              ;;
          esac

  e2e-tests:
    name: E2E 冒烟测试（部署后）
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 从 Infisical 读取 E2E 配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 2fcb7439-3d9d-4a03-868d-091f5d8aea35
          oidc-audience: infisical://secrets.a4.fit/makewheels/easy-book
          domain: https://secrets.a4.fit
          project-slug: easy-book-secrets
          env-slug: prod
          secret-path: /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke tests
        working-directory: e2e
        run: pnpm exec playwright test --reporter=list
