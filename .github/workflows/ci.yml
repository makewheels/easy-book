name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-unit-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # uv sync 按 uv.lock 安装（含 dev 组：pytest/pytest-asyncio/httpx）
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run unit tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/unit/ -v --tb=short

  backend-integration-tests:
    name: 后端集成测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run integration tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: easy_book_test
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm run build

  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    # 部署目标：services 机（101.42.94.17）k3s，入口 easybook.a4.fit（Caddy）
    # 流程：runner rsync 代码到服务器 → deploy/deploy.sh 构建镜像、导入 k3s、apply、健康检查
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: 写入 SSH 密钥
        run: |
          mkdir -p ~/.ssh-tmp
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh-tmp/key
          chmod 600 ~/.ssh-tmp/key

      - name: 同步代码到服务器
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude '.mongodb-url' --exclude '.agent-env' \
            -e "ssh -i ~/.ssh-tmp/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/ubuntu/easy-book/"

      - name: 执行部署
        run: |
          ssh -i ~/.ssh-tmp/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /home/ubuntu/easy-book && ./deploy/deploy.sh"
